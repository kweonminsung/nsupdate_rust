options {
    directory "/tmp";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
    pid-file "/tmp/named.pid";
    session-keyfile "/tmp/session.key";
};
controls { };
// These keys are public test data and must never be used in a real deployment.
key "test-md5" { algorithm hmac-md5; secret "dGVzdA=="; };
key "test-sha1" { algorithm hmac-sha1; secret "dGVzdA=="; };
key "test-sha224" { algorithm hmac-sha224; secret "dGVzdA=="; };
key "test-sha256" { algorithm hmac-sha256; secret "dGVzdA=="; };
key "test-sha384" { algorithm hmac-sha384; secret "dGVzdA=="; };
key "test-sha512" { algorithm hmac-sha512; secret "dGVzdA=="; };
zone "example.test" {
    type primary;
    file "/fixtures/db.example.test";
    journal "/tmp/example.test.jnl";
    allow-update { key test-md5; key test-sha1; key test-sha224; key test-sha256; key test-sha384; key test-sha512; };
};
zone "refused.test" {
    type primary;
    file "/fixtures/db.refused.test";
    allow-update { none; };
};
zone "unsigned.test" {
    type primary;
    file "/fixtures/db.unsigned.test";
    journal "/tmp/unsigned.test.jnl";
    allow-update { any; };
};
